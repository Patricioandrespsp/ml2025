<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grants - Morpholab Laboratory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html#about">
                        <img src="./assets/img/Logo1.png" alt="Icono de Morpholab" width="65" height="65">
                    </a>
                </div>
                
                <!-- Hamburger Menu Icon for Mobile -->
                <div class="hamburger-menu" id="hamburgerMenu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <nav class="nav" id="mainNav">
                    <ul class="nav-list">
                        <li><a href="index.html#about">About us</a></li>
                        <li><a href="index.html#people">People</a></li>
                        <li><a href="index.html#publications">Publications</a></li>
                        <li><a href="grants.html">Grants</a></li>
                        <li><a href="index.html#contact">Contact</a></li>
                    </ul>
                </nav>
                <div class="social-icons">
                    <a href="https://www.instagram.com/morphology_lab" target="_blank">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://x.com/PauloSalinas" target="_blank" class="x-icon">
                        <i class="fab fa-x-twitter"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Grants Section -->
    <section class="publications-section">
        <div class="container">
            <h2 class="section-title">Grants</h2>
            <div class="publications-grid" id="grantsGrid">
                <!-- Las tarjetas se cargarán dinámicamente con JavaScript -->
            </div>
            <div class="show-more-container">
                <button class="show-more-btn blue-btn" id="showMoreGrantsBtn">Show all</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 Paulo Salinas. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        // Grants Data (ordenados cronológicamente, del más reciente al más antiguo)
        const grants = [
            {
                title: "Changes in spermatogenesis, energy metabolism and oxidative stress in the adult testis induced by maternal exposure",
                grant: "Pontificia Universidad Católica de Valparaíso. Research and Advanced Studies Directorate (DI 039.703/2025)",
                institution: "PUCV",
                year: "2025"
            },
            {
                title: "Reproductive effects of air pollution produced by residential wood combustion exposure in south-central Chile, with emphasis on placenta, umbilical cord, ovary, and endometrium: An experimental study in rats.",
                grant: "Fondecyt Initiation 2020 (No. 11200775)",
                institution: "Fondecyt",
                year: "2020"
            },
            {
                title: "Study of the biomechanics of bones of the endangered Patagonian huemul deer (Hippocamelus bisulcus) using finite element analysis and 3D geometric morphometrics.",
                grant: "Pontificia Universidad Católica de Valparaíso (PUCV), DI 039.407/2021 -- Innovative Interdisciplinary Research",
                institution: "PUCV",
                year: "2021"
            },
            {
                title: "Effects of air pollution exposure from wood-burning stoves during pregnancy and lactation on adult testicular function and morphology: An experimental study in rats.",
                grant: "Pontificia Universidad Católica de Valparaíso, Research and Advanced Studies Directorate (2020)",
                institution: "PUCV",
                year: "2020"
            },
            {
                title: "Reproductive effects of air pollution produced by residential wood combustion exposure in Chile, with emphasis on the ovary and endometrium: A stereological study in rats.",
                grant: "Pontificia Universidad Católica de Valparaíso, Research and Advanced Studies Directorate (2019)",
                institution: "PUCV",
                year: "2019"
            },
            {
                title: "Reproductive effects of air pollution produced by residential wood combustion exposure in south-central Chile, with emphasis on the umbilical cord: A stereological analysis in rats.",
                grant: "Pontificia Universidad Católica de Valparaíso, Research and Advanced Studies Directorate (2018)",
                institution: "PUCV",
                year: "2018"
            },
            {
                title: "Stereology in parenchymal organs of Atlantic salmon (Salmo salar), in collaboration with Marine Harvest, Universidad de La Frontera (UFRO), and Universidad Santo Tomás (UST).",
                grant: "Universidad Santo Tomás, Research & Postgraduate Directorate (2016-2017)",
                institution: "UST",
                year: "2016-2017"
            },
            {
                title: "Morphological study of the effects of progestogen use as a contraceptive method on the uterus and uterine tubes in female dogs.",
                grant: "Universidad Santo Tomás, Research & Postgraduate Directorate (2014-2015)",
                institution: "UST",
                year: "2014-2015"
            },
            {
                title: "Application of an intrauterine device in livestock animals as a contraceptive tool in cattle.",
                grant: "Universidad Santo Tomás, Research & Postgraduate Directorate (2010-2011, Project No. 1990993)",
                institution: "UST",
                year: "2010-2011"
            }
        ];

        // Grants Management
        let currentGrantsDisplayed = 4;
        const grantsPerLoad = 4;

        function createGrantCard(grant) {
            return `
                <div class="publication-card">
                    <div class="card-content">
                        <h3>${grant.title}</h3>
                        <p class="grant-details">${grant.grant}</p>
                        <div class="journal-year">
                            <span class="journal">${grant.institution}</span>
                            <span class="year">${grant.year}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function loadGrants() {
            const grid = document.getElementById('grantsGrid');
            grid.innerHTML = grants.map(grant => createGrantCard(grant)).join('');
            
            const cards = grid.querySelectorAll('.publication-card');
            cards.forEach((card, index) => {
                if (index < currentGrantsDisplayed) {
                    card.classList.add('visible');
                }
            });

            updateShowMoreGrantsButton();
        }

        function updateShowMoreGrantsButton() {
            const btn = document.getElementById('showMoreGrantsBtn');
            if (currentGrantsDisplayed >= grants.length) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
            }
        }

        // Show More Button Handler for Grants
        document.addEventListener('DOMContentLoaded', function() {
            loadGrants();

            document.getElementById('showMoreGrantsBtn').addEventListener('click', function() {
                const cards = document.querySelectorAll('#grantsGrid .publication-card');
                const nextBatch = Math.min(currentGrantsDisplayed + grantsPerLoad, grants.length);
                
                for (let i = currentGrantsDisplayed; i < nextBatch; i++) {
                    cards[i].classList.add('visible');
                }
                
                currentGrantsDisplayed = nextBatch;
                updateShowMoreGrantsButton();
            });

            // Mobile Menu Functionality
            const hamburgerMenu = document.getElementById('hamburgerMenu');
            const mainNav = document.getElementById('mainNav');
            
            if (hamburgerMenu && mainNav) {
                hamburgerMenu.addEventListener('click', function() {
                    hamburgerMenu.classList.toggle('active');
                    mainNav.classList.toggle('active');
                    
                    // Prevent body scroll when menu is open
                    if (mainNav.classList.contains('active')) {
                        document.body.style.overflow = 'hidden';
                    } else {
                        document.body.style.overflow = 'auto';
                    }
                });
                
                // Close menu when clicking on a link
                const navLinks = mainNav.querySelectorAll('a');
                navLinks.forEach(link => {
                    link.addEventListener('click', function() {
                        hamburgerMenu.classList.remove('active');
                        mainNav.classList.remove('active');
                        document.body.style.overflow = 'auto';
                    });
                });
                
                // Close menu when clicking outside
                document.addEventListener('click', function(event) {
                    const isClickInsideNav = mainNav.contains(event.target);
                    const isClickOnHamburger = hamburgerMenu.contains(event.target);
                    
                    if (!isClickInsideNav && !isClickOnHamburger && mainNav.classList.contains('active')) {
                        hamburgerMenu.classList.remove('active');
                        mainNav.classList.remove('active');
                        document.body.style.overflow = 'auto';
                    }
                });
            }

            // Smooth scroll
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        const headerHeight = document.querySelector('.header').offsetHeight;
                        const targetPosition = target.offsetTop - headerHeight - 20;
                        window.scrollTo({
                            top: targetPosition,
                            behavior: 'smooth'
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
